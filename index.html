<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>育成リソースノート</title><meta name="apple-mobile-web-app-title" content="育成リソースノート"><meta name="application-name" content="育成リソースノート"><link rel="apple-touch-icon" href="resource-note-icon.png"><link rel="icon" type="image/png" sizes="512x512" href="resource-note-icon.png"><link rel="stylesheet" href="style.css?v=20260920-picker"><script src="pokemon-data.js?v=20260920-display" defer></script><script src="main-skill-master.js" defer></script><script src="core.js?v=20260920-mew-optional" defer></script><script src="backup.js" defer></script><script src="mew-image.js?v=20260920-display" defer></script><script src="weekly-chart.js?v=20260920-summary-ui" defer></script><script src="shards.js?v=20260920-picker" defer></script><script src="history-tools.js?v=20260920-mew-optional" defer></script><script src="period-picker.js?v=20260920-picker" defer></script><script src="app.js?v=20260920-picker" defer></script></head><body><main class="app">
<header><small>CANDY JOURNAL</small><h1>育成リソースノート</h1></header><p id="notice" role="status" aria-live="polite"></p>
<section id="record"><div id="today-total" class="hero"></div><div class="card record-date-card"><input id="datetime" type="datetime-local" aria-label="記録日時"><label class="check"><input id="auto-now" type="checkbox" checked> 今すぐ記録</label></div><div id="record-methods"></div><div id="shard-records" class="shards"><div id="shard-skill-inputs"></div><details class="card research-card" id="research-panel" open><summary>睡眠リサーチ</summary><form id="shard-research-form"><div class="filters research-fields"><label>対象日<input id="shard-research-date" type="date" required></label><label>リサーチレベル<input id="shard-research-level" type="number" inputmode="numeric" min="1" max="70" step="1" required></label><label>リサーチEXP<input id="shard-research-exp" type="number" inputmode="numeric" min="0" max="1000000000" step="1" required></label><label>ゆめのかけら<input id="shard-research-base" type="number" inputmode="numeric" min="0" max="1000000000" step="1" required></label></div><button type="submit" id="research-save">リサーチを記録</button></form></details><div class="card"><h2>その他のゆめのかけら</h2><form id="shard-other-form"><label>獲得したゆめのかけら<input id="shard-other-amount" type="number" inputmode="numeric" min="0" max="1000000000" step="1" required></label><label>取得内容のメモ<input id="shard-other-memo" type="text" maxlength="1000" placeholder="ミッション報酬など"></label><button type="submit">その他を記録</button></form></div></div></section>
<section id="summary" hidden><h2>アメ</h2><div class="card period-controls"><label class="period-heading" for="period">集計期間</label><label class="date-heading" for="summary-date">基準日</label><button type="button" id="summary-today">今日に戻る</button><select id="period"><option value="day">日</option><option value="week">週</option><option value="month">月</option><option value="all">全期間</option></select><div class="period-date"><input type="date" id="summary-date" aria-label="基準日"></div></div><p id="range-label" hidden></p><div id="summary-total" class="hero"></div><div class="card mew" id="mew-image-card"><button type="button" id="create-mew-image">ミュウ分析画像を作成</button><img id="mew-image-preview" alt="ミュウ分析画像" hidden></div><div class="card"><h3>週間のアメ</h3><div id="candy-weekly-chart"></div></div><div class="card"><h3>日ごとのアメ</h3><p id="candy-month" class="calendar-month"></p><p class="legend"><span class="help">おてつだい</span><span class="mew">ミュウ</span><span class="delibird">デリバード</span></p><div id="candy-calendar" class="calendar"></div></div><div class="card"><h3>獲得位置ごとの集計</h3><div id="slot-counts"></div></div><div class="card" id="analysis-card"><h3>スキル位置と獲得先</h3><div class="filters"><label>入手方法<select id="analysis-method"><option value="mew">ミュウ</option><option value="delibird">デリバード</option></select></label><label>スキル個体<select id="analysis-actor"></select></label><label>補正後のスキルレベル<select id="analysis-level"><option value="">すべて</option></select></label><label>確率倍率<select id="analysis-multiplier"><option value="">すべて</option><option value="1">通常</option><option value="1.25">1.25倍</option><option value="1.5">1.5倍</option></select></label><label>獲得個数<select id="analysis-amount"><option value="">すべて</option><option value="0">0個</option><option value="1">1個</option><option value="2">2個</option><option value="3">3個</option><option value="4">4個</option></select></label></div><div id="analysis"></div></div><div class="card"><h3>アメ種類別の合計</h3><div id="candy-list"></div></div></section>
<section id="shards" class="shards" hidden><h2>ゆめのかけら</h2><div class="card period-controls"><label class="period-heading" for="shard-period">集計期間</label><label class="date-heading" for="shard-date">基準日</label><button type="button" id="shard-today">今日に戻る</button><select id="shard-period"><option value="day">日</option><option value="week">週</option><option value="month">月</option><option value="all">全期間</option></select><div class="period-date"><input type="date" id="shard-date" aria-label="基準日"></div></div><p id="shard-range" hidden></p><div id="shard-total" class="hero"></div><div class="card"><h3>週間のゆめのかけら</h3><div id="shard-weekly-chart"></div></div><div class="card"><h3>ポケモンごとのスキル集計</h3><div id="shard-pokemon-totals"></div></div></section><section id="history" hidden><div class="section-head"><h2>履歴</h2></div><div class="card filters"><label>表示期間<select id="history-period"><option value="day">日付</option><option value="week">週</option><option value="month">月</option><option value="all">全期間</option></select></label><label>基準日<input id="history-date" type="date"></label></div><p id="history-day" hidden></p><div id="history-list"></div></section>
<section id="team" hidden><h2 class="help">おてつだい編成</h2><div id="team-slots" class="card help"></div><div class="section-head"><h2>登録ポケモン</h2><button type="button" id="sort-toggle">並べ替え</button></div><button type="button" id="sort-reset" hidden>登録順に戻す</button><button id="roster-other-toggle" type="button">その他のポケモンを表示</button><div id="registered-pokemon-list"></div><div class="card" id="individual-editor"><h2>個体編集</h2><label>編集する個体<select id="profile-select"></select></label><form id="profile-form" hidden><p id="profile-species"></p><label>ニックネーム<input id="profile-nickname" maxlength="40"></label><label id="profile-main-skill-label" hidden>メインスキル<select id="profile-main-skill"></select></label><div id="profile-details"><div class="filters profile-stats"><label>レベル<input type="number" inputmode="numeric" id="profile-level" min="1" max="100"></label><label>スキルレベル<input type="number" inputmode="numeric" id="profile-skill" min="1" max="8"></label><label>性格<select id="profile-nature"></select></label></div><div id="subskill-fields"></div></div><button type="submit">登録内容を保存</button></form></div><div class="card"><h2>ポケモン登録</h2><label>ポケモン名を検索<input id="pokemon-search" placeholder="例：ぴかちゅう"></label><div id="pokemon-search-results" class="catalog"></div><p id="selected-name">一覧から選んでください。</p><label>メインスキル<select id="register-main-skill" disabled></select></label><label>ニックネーム（任意）<input id="nickname" maxlength="40"></label><button id="add-pokemon" disabled>＋ポケモンを追加</button></div></section>
<section id="settings" hidden><h2>設定</h2><div class="card"><h3>表示</h3><label class="check mew"><input type="checkbox" id="enable-mew"> ミュウ</label><label class="check delibird"><input type="checkbox" id="enable-delibird"> デリバード</label></div><div class="card"><h3>イベント補正</h3><label>表示月<input type="month" id="event-month"></label><div id="event-calendar" class="calendar"></div><div id="event-list"></div><form id="event-form"><label>イベント名<input id="event-name" maxlength="80" placeholder="イベント週" required></label><div class="filters"><label>開始日<input type="date" id="event-start" required></label><label>終了日（この日まで）<input type="date" id="event-end" required></label><label>対象<select id="event-target"><option value="both">ミュウ・デリバード</option><option value="mew">ミュウ</option><option value="delibird">デリバード</option></select></label><label>スキル確率<select id="event-multiplier"><option value="1">通常（1倍）</option><option value="1.25">1.25倍</option><option value="1.5">1.5倍</option></select></label><label>スキルレベル上昇<input id="event-boost" type="number" min="0" max="7" value="0" required></label></div><button type="submit" id="save-event">イベントを保存</button> <button type="button" id="cancel-event" hidden>編集を取り消す</button></form></div><div class="card"><h3>バックアップ</h3><button id="export">CSVを書き出す</button><label>バックアップを復元（CSV・旧JSON）<input type="file" id="import" accept=".csv,text/csv,.json,application/json"></label></div></section>
<nav class="tabs" aria-label="メイン"><button data-tab="record" aria-current="page">記録</button><button data-tab="summary">アメ</button><button data-tab="shards">ゆめの<wbr>かけら</button><button data-tab="team">編成</button><button data-tab="history">履歴</button><button data-tab="settings">設定</button></nav><dialog id="history-editor"><form id="history-edit-form"><div class="section-head"><h2>履歴の訂正</h2><button type="button" id="edit-cancel">閉じる</button></div><label>日時<input type="datetime-local" id="edit-datetime" required></label><div class="filters"><label>入手方法<select id="edit-method"></select></label><label>獲得位置<select id="edit-slot"></select></label><label>アメの個数<select id="edit-amount"></select></label></div><div id="edit-mew-fields" hidden><label>記録時のスキルLv<input id="edit-mew-level" type="number" min="1" max="8" step="1" inputmode="numeric"></label><label>セット中のメインスキル<select id="edit-registered-skill"></select></label><label id="edit-mew-target-label">アメの対象ポケモン<select id="edit-mew-target"></select></label><label hidden>発動スキル<select id="edit-fired-skill"></select></label><label id="edit-mew-shards-label">ゆめのかけら<input id="edit-mew-shards" type="number" inputmode="numeric" min="1" max="1000000000"></label></div><label id="edit-species-label">ポケモン<select id="edit-species"></select></label><details><summary>編成・スキル個体を訂正</summary><label class="check"><input type="checkbox" id="edit-context"> 編成情報を保存する</label><div id="edit-team"></div><label>スキル個体<select id="edit-actor"></select></label><div class="filters"><label>確率倍率<select id="edit-multiplier"><option value="1">1倍</option><option value="1.25">1.25倍</option><option value="1.5">1.5倍</option></select></label><label>スキルレベル上昇<input type="number" id="edit-boost" min="0" max="7" value="0"></label></div><button type="button" id="edit-event-date">日時に合うイベント補正を適用</button></details><p id="edit-error" role="alert"></p><button type="submit">訂正を保存</button></form></dialog></main></body></html>
