<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>育成リソースノート</title><meta name="apple-mobile-web-app-title" content="育成Rノート"><meta name="application-name" content="育成リソースノート"><link rel="apple-touch-icon" sizes="512x512" href="resource-note-icon.png?v=20261006-brown"><link rel="icon" type="image/png" sizes="512x512" href="resource-note-icon.png?v=20261006-brown"><link rel="stylesheet" href="style.css?v=20260923-inputs"><script src="pokemon-data.js?v=20261005-foongus" defer></script><script src="main-skill-master.js?v=20261005-foongus" defer></script><script src="core.js?v=20260920-copy" defer></script><script src="backup.js" defer></script><script src="mew-image.js?v=20261007-location-first" defer></script><script src="weekly-chart.js?v=20261007-record-settings" defer></script><script src="shards.js?v=20261008-history-grid" defer></script><script src="history-tools.js?v=20261007-history-order" defer></script><script src="range-picker.js?v=20261006-analysis-simple" defer></script><script src="period-picker.js?v=20260928-range" defer></script><script src="copy-skills.js?v=20261001-analysis" defer></script><script src="record-picker.js?v=20260921-ui" defer></script><script src="number-input.js?v=20260923" defer></script><script src="summary-extras.js?v=20261008-candy-visibility" defer></script><script src="profile-form.js?v=20260928" defer></script><script src="analysis-data.js?v=20261006-actual-amounts" defer></script><script src="team-ui.js?v=20261007-views" defer></script><script src="team-picker.js?v=20261008-search" defer></script><script src="app.js?v=20261008-history-grid" defer></script><link rel="stylesheet" href="record-design.css?v=20261008-category-trial"><link rel="stylesheet" href="candy-design.css?v=20260925-sources"><link rel="stylesheet" href="remaining-design.css?v=20260925-stack"><link rel="stylesheet" href="summary-extras.css?v=20261005-unique"><link rel="stylesheet" href="app-design.css?v=20261008-history-grid"></head><body><main class="app">
<header><img class="series-icon" src="resource-note-icon.png?v=20261006-brown" width="44" height="44" alt=""><small>RESOURCE JOURNAL</small><h1>育成リソースノート</h1></header><p id="notice" role="status" aria-live="polite"></p>
<section id="record"><div id="today-total" class="hero"></div><div class="card record-date-card"><input id="datetime" type="datetime-local" aria-label="記録日時"><label class="check" for="auto-now"><input id="auto-now" type="checkbox" checked> 今すぐ記録</label></div><div id="record-methods"></div><div id="shard-records" class="shards"><div id="shard-skill-inputs"></div><details class="card research-card" id="research-panel" open><summary>睡眠リサーチ</summary><form id="shard-research-form"><div class="filters research-fields"><label>リサーチ日<input id="shard-research-date" type="date" required></label><label>リサーチレベル<input id="shard-research-level" type="number" inputmode="numeric" min="1" max="70" step="1" required></label><label>リサーチEXP<input id="shard-research-exp" type="number" inputmode="numeric" min="0" max="1000000000" step="1" required></label><label>ゆめのかけら<input id="shard-research-base" type="number" inputmode="numeric" min="0" max="1000000000" step="1" required></label></div><button type="submit" id="research-save">リサーチを記録</button></form></details><details class="card"><summary>その他のゆめのかけら</summary><form id="shard-other-form"><label>獲得したゆめのかけら<input id="shard-other-amount" type="number" inputmode="numeric" min="0" max="1000000000" step="1" required></label><label>取得内容のメモ<input id="shard-other-memo" type="text" maxlength="1000" placeholder="ミッション報酬など"></label><button type="submit">その他を記録</button></form></details></div></section>
<section id="summary" hidden aria-label="アメ"><p id="range-label" hidden></p><div id="summary-total" class="hero"></div><div class="card period-controls"><label class="period-heading" for="period">集計期間</label><label class="date-heading" for="summary-date">基準日</label><button type="button" id="summary-today">今日に戻る</button><select id="period"><option value="day">日</option><option value="week">週</option><option value="month">月</option><option value="all">全期間</option></select><div class="period-date"><input type="date" id="summary-date" aria-label="基準日"></div></div><div class="card"><div class="summary-section-head"><h3>アメ種類別合計</h3><button type="button" id="create-candy-image" aria-label="アメ種類別合計の画像を作成">画像</button></div><div id="candy-source-totals"></div><div id="candy-list"></div><div id="candy-image-preview"></div></div><div class="card"><h3>週間のアメ</h3><div id="candy-week-totals"></div><div id="candy-weekly-chart"></div></div><div class="card"><h3>月間のアメ</h3><div id="candy-month-totals"></div><p id="candy-month" class="calendar-month"></p><div id="candy-month-legend" class="month-legend"></div><div id="candy-calendar" class="calendar"></div></div><div class="card"><h3>獲得位置ごとの集計</h3><div id="slot-counts"></div></div><div class="card" id="analysis-card"><div class="summary-section-head"><h3>アメゲット記録</h3><button type="button" id="create-mew-image" aria-label="アメゲット記録の画像を作成">画像</button></div><div class="filters"><label>入手方法<select id="analysis-method"><option value="mew">ミュウ</option><option value="delibird">デリバード</option></select></label><label>スキル個体<select id="analysis-actor"></select></label><label>ゲットした個数<select id="analysis-amount"><option value="">すべて</option><option value="0">0個</option><option value="1">1個</option><option value="2">2個</option><option value="3">3個</option><option value="4">4個</option></select></label></div><div id="analysis"></div><img id="mew-image-preview" alt="アメゲット記録の画像" hidden></div></section>
<section id="shards" class="shards" hidden aria-label="ゆめのかけら"><p id="shard-range" hidden></p><div id="shard-total" class="hero"></div><div class="card period-controls"><label class="period-heading" for="shard-period">集計期間</label><label class="date-heading" for="shard-date">基準日</label><button type="button" id="shard-today">今日に戻る</button><select id="shard-period"><option value="day">日</option><option value="week">週</option><option value="month">月</option><option value="all">全期間</option></select><div class="period-date"><input type="date" id="shard-date" aria-label="基準日"></div></div><div class="card"><h3>週間のゆめのかけら</h3><div id="shard-week-totals"></div><div id="shard-weekly-chart"></div></div><div class="card"><h3>月間のゆめのかけら</h3><div id="shard-month-totals"></div><p id="shard-month" class="calendar-month"></p><div id="shard-month-legend" class="month-legend"></div><div id="shard-calendar" class="calendar"></div></div></section><section id="history" hidden aria-label="履歴"><div class="card filters"><label>表示期間<select id="history-period"><option value="day">日付</option><option value="week">週</option><option value="month">月</option><option value="all">全期間</option></select></label><label>基準日<input id="history-date" type="date"></label></div><p id="history-day" hidden></p><div id="history-list"></div></section>
<section id="team" hidden><div class="team-switch" role="tablist" aria-label="編成の表示"><button type="button" role="tab" id="team-tab-team" data-team-view="team" aria-selected="true" aria-controls="team-panel">チーム</button><button type="button" role="tab" id="team-tab-roster" data-team-view="roster" aria-selected="false" aria-controls="roster-panel">登録済み</button><button type="button" role="tab" id="team-tab-register" data-team-view="register" aria-selected="false" aria-controls="register-panel">新規登録</button></div><div id="team-panel" role="tabpanel" aria-labelledby="team-tab-team"><h2 class="help">チーム編成</h2><div id="team-slots" class="help"></div></div><div id="roster-panel" role="tabpanel" aria-labelledby="team-tab-roster" hidden><label>登録済みポケモンを検索<input id="roster-search" type="search" placeholder="ポケモン名・ニックネーム"></label><div class="section-head"><h2>登録ポケモン</h2><button type="button" id="sort-toggle">並べ替え</button></div><button type="button" id="sort-reset" hidden>登録順に戻す</button><button id="roster-other-toggle" type="button">その他のポケモンを表示</button><div id="registered-pokemon-list"></div></div><div id="individual-editor" hidden><button type="button" id="profile-back">登録済みに戻る</button><h2>個体編集</h2><label hidden>編集する個体<select id="profile-select"></select></label><form id="profile-form" hidden><p id="profile-species"></p><label>ニックネーム<input id="profile-nickname" maxlength="40"></label><label id="profile-main-skill-label" hidden>メインスキル<select id="profile-main-skill"></select></label><div id="profile-details"><div class="filters profile-stats"><label>レベル<input type="number" inputmode="numeric" id="profile-level" min="1" max="100"></label><label>スキルレベル<input type="number" inputmode="numeric" id="profile-skill" min="1" max="8"></label><label>性格<select id="profile-nature"></select></label></div><div id="subskill-fields"></div></div><button type="submit">登録内容を保存</button><button type="button" id="profile-remove" class="danger">登録解除</button></form></div><div id="register-panel" role="tabpanel" aria-labelledby="team-tab-register" hidden><h2>ポケモン登録</h2><label>ポケモン名を検索<input id="pokemon-search" placeholder="例：ぴかちゅう"></label><div id="pokemon-search-results" class="catalog"></div><div id="registration-fields" hidden><p id="selected-name">一覧から選んでください。</p><label>メインスキル<select id="register-main-skill" disabled></select></label><label>ニックネーム（任意）<input id="nickname" maxlength="40"></label><button id="add-pokemon" disabled>＋ポケモンを追加</button></div></div></section>
<section id="settings" hidden aria-label="設定"><div class="card record-display-settings"><h3>表示する記録</h3><p class="settings-intro">記録欄とアメの内訳に表示する項目を選びます。</p><div class="settings-group"><h4>アメ</h4><label class="setting-row"><span>アメ拾い</span><span class="setting-control"><input type="checkbox" role="switch" id="enable-help" checked><span class="setting-state" aria-hidden="true"></span></span></label><label class="setting-row"><span>ミュウ</span><span class="setting-control"><input type="checkbox" role="switch" id="enable-mew" checked><span class="setting-state" aria-hidden="true"></span></span></label><label class="setting-row"><span>デリバード</span><span class="setting-control"><input type="checkbox" role="switch" id="enable-delibird" checked><span class="setting-state" aria-hidden="true"></span></span></label><label class="setting-row"><span>その他のスキル</span><span class="setting-control"><input type="checkbox" role="switch" id="show-other-candy" checked><span class="setting-state" aria-hidden="true"></span></span></label></div><div class="settings-group"><h4>ゆめのかけら</h4><label class="setting-row"><span>スキル</span><span class="setting-control"><input type="checkbox" role="switch" id="setting-showShardSkill" checked><span class="setting-state" aria-hidden="true"></span></span></label><label class="setting-row"><span>睡眠リサーチ</span><span class="setting-control"><input type="checkbox" role="switch" id="setting-showShardResearch" checked><span class="setting-state" aria-hidden="true"></span></span></label><label class="setting-row"><span>その他</span><span class="setting-control"><input type="checkbox" role="switch" id="setting-showShardOther" checked><span class="setting-state" aria-hidden="true"></span></span></label></div></div><div class="card"><h3>イベント補正</h3><label>表示月<input type="month" id="event-month"></label><div id="event-calendar" class="calendar"></div><div id="event-list"></div><form id="event-form"><label>イベント名<input id="event-name" maxlength="80" placeholder="イベント週" required></label><div class="filters"><label>開始日<input type="date" id="event-start" required></label><label>終了日（この日まで）<input type="date" id="event-end" required></label><label>対象<select id="event-target"><option value="both">ミュウ・デリバード</option><option value="mew">ミュウ</option><option value="delibird">デリバード</option></select></label><label>スキル確率<select id="event-multiplier"><option value="1">通常（1倍）</option><option value="1.25">1.25倍</option><option value="1.5">1.5倍</option></select></label><label>スキルレベル上昇<input id="event-boost" type="number" min="0" max="7" value="0" required></label></div><button type="submit" id="save-event">イベントを保存</button> <button type="button" id="cancel-event" hidden>編集を取り消す</button></form></div><div class="card"><h3>データ</h3><p class="settings-intro">CSVバックアップの保存・復元</p><div class="backup-actions"><button type="button" id="export">保存</button><button type="button" id="restore-backup">復元</button></div><input type="file" id="import" aria-label="バックアップを復元（CSV・旧JSON）" accept=".csv,text/csv,.json,application/json" hidden></div></section>
<nav class="tabs" aria-label="メイン"><button data-tab="record" aria-current="page">記録</button><button data-tab="summary">アメ</button><button data-tab="shards"><span class="tab-line">ゆめの</span><br><span class="tab-line">かけら</span></button><button data-tab="team">編成</button><button data-tab="history">履歴</button><button data-tab="settings">設定</button></nav><dialog id="history-editor"><form id="history-edit-form"><div class="section-head"><h2>履歴の訂正</h2><button type="button" id="edit-cancel">閉じる</button></div><label>日時<input type="datetime-local" id="edit-datetime" required></label><div class="filters"><label>入手方法<select id="edit-method"></select></label><label>獲得位置<select id="edit-slot"></select></label><label>アメの個数<select id="edit-amount"></select></label></div><div id="edit-mew-fields" hidden><label>記録時のスキルLv<input id="edit-mew-level" type="number" min="1" max="8" step="1" inputmode="numeric"></label><label>セット中のメインスキル<select id="edit-registered-skill"></select></label><label id="edit-mew-target-label">アメの対象ポケモン<select id="edit-mew-target"></select></label><label hidden>発動スキル<select id="edit-fired-skill"></select></label><label id="edit-mew-shards-label">ゆめのかけら<input id="edit-mew-shards" type="number" inputmode="numeric" min="1" max="1000000000"></label></div><label id="edit-species-label">ポケモン<select id="edit-species"></select></label><details><summary>編成・スキル個体を訂正</summary><label class="check"><input type="checkbox" id="edit-context"> 編成情報を保存する</label><div id="edit-team"></div><label>スキル個体<select id="edit-actor"></select></label><div class="filters"><label>確率倍率<select id="edit-multiplier"><option value="1">1倍</option><option value="1.25">1.25倍</option><option value="1.5">1.5倍</option></select></label><label>スキルレベル上昇<input type="number" id="edit-boost" min="0" max="7" value="0"></label></div><button type="button" id="edit-event-date">日時に合うイベント補正を適用</button></details><p id="edit-error" role="alert"></p><button type="submit">訂正を保存</button></form></dialog></main><dialog id="team-picker" aria-labelledby="team-picker-title"><div class="team-picker-header"><div class="team-picker-heading"><h2 id="team-picker-title">ポケモンを選択</h2><button type="button" id="team-picker-close" aria-label="ポケモン選択を閉じる">閉じる</button></div><p id="team-picker-context"></p><label for="team-picker-search">名前／ニックネームを検索</label><input id="team-picker-search" type="search" placeholder="例：みゅう・わたあめ" autocomplete="off"><p id="team-picker-error" role="alert"></p></div><div id="team-picker-list" aria-label="登録済みポケモン"></div></dialog></body></html>
